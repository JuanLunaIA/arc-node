name: T-1 PoC Test

on:
  workflow_dispatch:

jobs:
  test-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -C debuginfo=1 -C codegen-units=1
      CARGO_INCREMENTAL: "0"
    
    steps:
      - name: Checkout arc-node
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-t1-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build arc-signer tests
        run: cargo test -p arc-signer --features local --release --no-run 2>&1 | tail -20
      
      - name: Run T-1 PoC tests (capture panic)
        id: run_tests
        run: |
          set +e
          cargo test -p arc-signer t1_arc_signing_provider --features local --release -- --nocapture --test-threads=1 > /tmp/t1_output.txt 2>&1
          EXIT=$?
          echo "cargo test exit code: $EXIT"
          echo "--- CAPTURED OUTPUT ---"
          cat /tmp/t1_output.txt
          echo "--- END OUTPUT ---"
        env:
          RUST_BACKTRACE: full
      
      - name: Verify panic message present
        run: |
          if grep -q "Vote extensions are not supported in Arc at the moment" /tmp/t1_output.txt; then
            echo "PASS: unreachable!() panic message captured"
          else
            echo "FAIL: panic message not found"
            exit 1
          fi

      - name: Upload captured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-panic-output
          path: /tmp/t1_output.txt
