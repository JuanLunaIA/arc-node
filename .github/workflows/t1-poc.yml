name: T-1 PoC Test

on:
  workflow_dispatch:

jobs:
  test-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -C debuginfo=1 -C codegen-units=1
      CARGO_INCREMENTAL: "0"
    
    steps:
      - name: Checkout arc-node
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-t1-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run T-1 PoC tests (asserting panic)
        id: run_tests
        run: |
          set -o pipefail
          # #[should_panic(expected="...")] means: test passes IFF the awaited call panics
          # with exactly that message. A passing suite is the proof the arm is unreachable-guarded.
          cargo test -p arc-signer t1_arc_signing_provider --features local --release -- --nocapture --test-threads=1 2>&1 | tee /tmp/t1_output.txt
        env:
          RUST_BACKTRACE: full
      
      - name: Confirm the panic string appears as an actual panic line
        run: |
          # The real panic line, not the harness's "expected substring" echo.
          if grep -E "panicked at.*signer/src/lib.rs|Vote extensions are not supported in Arc at the moment" /tmp/t1_output.txt | grep -v "expected substring"; then
            echo "OK: panic reached ArcSigningProvider::*_vote_extension"
          else
            echo "FAIL: no genuine panic from ArcSigningProvider"
            exit 1
          fi

      - name: Upload captured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-panic-output
          path: /tmp/t1_output.txt
