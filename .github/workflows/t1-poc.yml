name: T-1 PoC Test

on:
  workflow_dispatch:

jobs:
  test-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: -C debuginfo=0 -C codegen-units=1
      CARGO_INCREMENTAL: "0"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Checkout Malachite
        uses: actions/checkout@v4
        with:
          repository: JuanLunaIA/malachite
          path: malachite
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run T-1 PoC tests in arc-signer
        run: |
          # Run the specific T-1 tests that trigger the unreachable!() panic
          cargo test -p arc-signer t1_arc_signing_provider --features local --release 2>&1 || true
        env:
          RUST_BACKTRACE: full

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-panic-logs
          path: |
            target/release/deps/arc-signer*
            malachite/code/target/release/deps/arc-malachitebft-*
